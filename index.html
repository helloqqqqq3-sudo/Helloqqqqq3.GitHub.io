<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  
  <!-- iOS Fullscreen & Web App Tags -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Zephyr Store">
  
  <title>Zephyr Store</title>
  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #000000;
      color: #ffffff;
      margin: 0;
      padding: calc(env(safe-area-inset-top) + 20px) 20px calc(env(safe-area-inset-bottom) + 20px) 20px;
      user-select: none;
    }
    header {
      border-bottom: 1px solid #2c2c2e;
      padding-bottom: 15px;
      margin-bottom: 20px;
    }
    .subtitle {
      color: #8e8e93;
      font-size: 13px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin: 0 0 4px 0;
    }
    h1 {
      font-size: 34px;
      font-weight: 700;
      margin: 0;
    }
    .app-card {
      background-color: #1c1c1e;
      border-radius: 16px;
      padding: 14px;
      display: flex;
      align-items: center;
      margin-bottom: 14px;
    }
    .app-icon {
      width: 56px;
      height: 56px;
      border-radius: 13px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 26px;
      margin-right: 14px;
      flex-shrink: 0;
    }
    .app-info {
      flex: 1;
      overflow: hidden;
    }
    .app-title {
      font-size: 17px;
      font-weight: 600;
      margin: 0 0 3px 0;
    }
    .app-desc {
      font-size: 13px;
      color: #8e8e93;
      margin: 0;
    }
    .get-btn {
      background-color: #2c2c2e;
      color: #0a84ff;
      border: none;
      padding: 7px 18px;
      border-radius: 20px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
    }
    .get-btn:active {
      background-color: #3a3a3c;
    }

    /* Fullscreen Modal for Mini-Apps */
    #app-viewer {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: #111;
      z-index: 999;
      flex-direction: column;
      padding-top: env(safe-area-inset-top);
    }
    .viewer-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 20px;
      background: #1c1c1e;
      border-bottom: 1px solid #2c2c2e;
    }
    .close-btn {
      background: none;
      border: none;
      color: #0a84ff;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
    }
    #app-content {
      flex: 1;
      padding: 20px;
      overflow-y: auto;
    }
  </style>
</head>
<body>

  <header>
    <p class="subtitle">Personal OS Hub</p>
    <h1>App Store</h1>
  </header>

  <!-- App 1: Notepad -->
  <div class="app-card">
    <div class="app-icon" style="background: linear-gradient(135deg, #FF9F0A, #FF375F);">📝</div>
    <div class="app-info">
      <p class="app-title">Quick Notes</p>
      <p class="app-desc">Auto-saving scratchpad</p>
    </div>
    <button class="get-btn" onclick="openApp('notes')">OPEN</button>
  </div>

  <!-- App 2: Calculator -->
  <div class="app-card">
    <div class="app-icon" style="background: linear-gradient(135deg, #30D158, #0A84FF);">🧮</div>
    <div class="app-info">
      <p class="app-title">Calculator</p>
      <p class="app-desc">Fast math utility</p>
    </div>
    <button class="get-btn" onclick="openApp('calc')">OPEN</button>
  </div>

  <!-- App 3: Clock -->
  <div class="app-card">
    <div class="app-icon" style="background: linear-gradient(135deg, #BF5AF2, #5E5CE6);">⏱️</div>
    <div class="app-info">
      <p class="app-title">Digital Clock</p>
      <p class="app-desc">Live fullscreen display</p>
    </div>
    <button class="get-btn" onclick="openApp('clock')">OPEN</button>
  </div>

  <!-- Built-in App Container -->
  <div id="app-viewer">
    <div class="viewer-bar">
      <strong id="viewer-title">App</strong>
      <button class="close-btn" onclick="closeApp()">Done</button>
    </div>
    <div id="app-content"></div>
  </div>

  <script>
    let clockInterval;

    function openApp(appId) {
      const viewer = document.getElementById('app-viewer');
      const title = document.getElementById('viewer-title');
      const content = document.getElementById('app-content');
      viewer.style.display = 'flex';

      if (appId === 'notes') {
        title.innerText = 'Quick Notes';
        const saved = localStorage.getItem('zephyr_notes') || '';
        content.innerHTML = `<textarea id="note-area" placeholder="Type your notes here..." style="width:100%; height:70vh; background:#1c1c1e; color:#fff; border:none; border-radius:12px; padding:15px; font-size:16px; outline:none;">${saved}</textarea>`;
        document.getElementById('note-area').addEventListener('input', (e) => {
          localStorage.setItem('zephyr_notes', e.target.value);
        });
      } 
      else if (appId === 'calc') {
        title.innerText = 'Calculator';
        content.innerHTML = `
          <input id="calc-display" type="text" readonly style="width:100%; background:#1c1c1e; color:#fff; border:none; border-radius:12px; padding:20px; font-size:32px; text-align:right; margin-bottom:15px;">
          <div style="display:grid; grid-template-columns:repeat(4,1fr); gap:10px;">
            ${['7','8','9','/','4','5','6','*','1','2','3','-','C','0','=','+'].map(btn => 
              `<button onclick="pressCalc('${btn}')" style="padding:20px; font-size:20px; font-weight:bold; border:none; border-radius:12px; background:${btn==='='?'#0a84ff':'#2c2c2e'}; color:#fff;">${btn}</button>`
            ).join('')}
          </div>`;
      } 
      else if (appId === 'clock') {
        title.innerText = 'Digital Clock';
        content.innerHTML = `<div id="live-time" style="font-size:54px; font-weight:700; text-align:center; margin-top:25vh;"></div>`;
        const updateTime = () => {
          document.getElementById('live-time').innerText = new Date().toLocaleTimeString();
        };
        updateTime();
        clockInterval = setInterval(updateTime, 1000);
      }
    }

    function pressCalc(val) {
      const disp = document.getElementById('calc-display');
      if (val === 'C') disp.value = '';
      else if (val === '=') {
        try { disp.value = eval(disp.value) || ''; } catch { disp.value = 'Error'; }
      } else {
        disp.value += val;
      }
    }

    function closeApp() {
      clearInterval(clockInterval);
      document.getElementById('app-viewer').style.display = 'none';
    }
  </script>

</body>
</html>
